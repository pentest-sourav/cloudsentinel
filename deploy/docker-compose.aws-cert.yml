services:
  api:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID must be set}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY must be set}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:?AWS_SESSION_TOKEN must be set}
      AWS_REGION: ${AWS_REGION:?AWS_REGION must be set}
      AWS_DEFAULT_REGION: ${AWS_REGION:?AWS_REGION must be set}
      CLOUDSENTINEL_AWS_PRINCIPAL_ARN: ${CLOUDSENTINEL_AWS_PRINCIPAL_ARN:?CLOUDSENTINEL_AWS_PRINCIPAL_ARN must be set}
      AWS_STS_SESSION_DURATION_SECONDS: ${AWS_STS_SESSION_DURATION_SECONDS:-3600}

  worker:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID must be set}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY must be set}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:?AWS_SESSION_TOKEN must be set}
      AWS_REGION: ${AWS_REGION:?AWS_REGION must be set}
      AWS_DEFAULT_REGION: ${AWS_REGION:?AWS_REGION must be set}
      CLOUDSENTINEL_AWS_PRINCIPAL_ARN: ${CLOUDSENTINEL_AWS_PRINCIPAL_ARN:?CLOUDSENTINEL_AWS_PRINCIPAL_ARN must be set}
