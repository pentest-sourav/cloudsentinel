global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus-config/prometheus-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: cloudsentinel-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
    authorization:
      type: Bearer
      credentials_file: /run/secrets/cloudsentinel_metrics_token
