# Merge with deploy/docker-compose.prod.yml.
# Keep Prometheus/Alertmanager on the internal network; expose them only through
# an operator-controlled private network or VPN in the real deployment.
services:
  prometheus:
    image: prom/prometheus:v3.8.1
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus-alerts.yml:/etc/prometheus/rules/prometheus-alerts.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - cloudsentinel_metrics_token
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    networks:
      - internal
    depends_on:
      - api
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.30.1
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks:
      - internal

secrets:
  cloudsentinel_metrics_token:
    file: ./secrets/cloudsentinel_metrics_token

volumes:
  prometheus_data:
  alertmanager_data:
