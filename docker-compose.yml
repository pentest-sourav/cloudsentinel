services:
  postgres:
    image: postgres:17
    container_name: cloudsentinel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudsentinel}
      POSTGRES_USER: ${POSTGRES_USER:-cloudsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

    ports:
      - "15432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: cloudsentinel-redis
    restart: unless-stopped

    ports:
      - "16379:6379"

    volumes:
      - redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    healthcheck:
      test:
        ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cloudsentinel-api
    restart: unless-stopped
    stop_grace_period: 30s

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cloudsentinel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-cloudsentinel}
      REDIS_URL: redis://redis:6379/0
      SCAN_QUEUE_STREAM: ${SCAN_QUEUE_STREAM:-cloudsentinel:scan_jobs}
      SCAN_QUEUE_GROUP: ${SCAN_QUEUE_GROUP:-cloudsentinel:scan_workers}
      SCAN_QUEUE_MAX_RETRIES: ${SCAN_QUEUE_MAX_RETRIES:-3}
      SCAN_QUEUE_RECOVERY_IDLE_MS: ${SCAN_QUEUE_RECOVERY_IDLE_MS:-30000}
      SCAN_QUEUE_RECOVERY_BATCH_SIZE: ${SCAN_QUEUE_RECOVERY_BATCH_SIZE:-10}
      SCAN_QUEUE_READ_BLOCK_MS: ${SCAN_QUEUE_READ_BLOCK_MS:-5000}
      SCAN_QUEUE_DEAD_LETTER_MAX_LENGTH: ${SCAN_QUEUE_DEAD_LETTER_MAX_LENGTH:-10000}
      SCAN_QUEUE_WORKER_HEARTBEAT_SECONDS: ${SCAN_QUEUE_WORKER_HEARTBEAT_SECONDS:-10}
      SCAN_QUEUE_WORKER_STALE_SECONDS: ${SCAN_QUEUE_WORKER_STALE_SECONDS:-30}
      MAX_CONCURRENT_SCANS_PER_TENANT: ${MAX_CONCURRENT_SCANS_PER_TENANT:-2}
      SCAN_SCHEDULER_POLL_SECONDS: ${SCAN_SCHEDULER_POLL_SECONDS:-10}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-auto}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_AUTH_MAX_REQUESTS: ${RATE_LIMIT_AUTH_MAX_REQUESTS:-10}
      RATE_LIMIT_SCAN_MAX_REQUESTS: ${RATE_LIMIT_SCAN_MAX_REQUESTS:-20}
      RATE_LIMIT_GLOBAL_MAX_REQUESTS: ${RATE_LIMIT_GLOBAL_MAX_REQUESTS:-300}
      # Production: set this to the IAM role/user ARN that CloudSentinel
      # uses to assume customer AWS audit roles.
      # Local development falls back to the mounted AWS identity.
      CLOUDSENTINEL_AWS_PRINCIPAL_ARN: ${CLOUDSENTINEL_AWS_PRINCIPAL_ARN:-}

    ports:
      - "8000:8000"

    # Local development only.
    # Production should use the CloudSentinel runtime IAM role.
    volumes:
      - ${HOME}/.aws:/home/cloudsentinel/.aws:ro

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      [
        "uvicorn",
        "backend.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cloudsentinel-worker
    restart: unless-stopped
    stop_grace_period: 30s

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cloudsentinel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-cloudsentinel}
      REDIS_URL: redis://redis:6379/0
      SCAN_QUEUE_STREAM: ${SCAN_QUEUE_STREAM:-cloudsentinel:scan_jobs}
      SCAN_QUEUE_GROUP: ${SCAN_QUEUE_GROUP:-cloudsentinel:scan_workers}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-auto}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_AUTH_MAX_REQUESTS: ${RATE_LIMIT_AUTH_MAX_REQUESTS:-10}
      RATE_LIMIT_SCAN_MAX_REQUESTS: ${RATE_LIMIT_SCAN_MAX_REQUESTS:-20}
      RATE_LIMIT_GLOBAL_MAX_REQUESTS: ${RATE_LIMIT_GLOBAL_MAX_REQUESTS:-300}
      CLOUDSENTINEL_AWS_PRINCIPAL_ARN: ${CLOUDSENTINEL_AWS_PRINCIPAL_ARN:-}

    # Local development only.
    # Production should use the CloudSentinel runtime IAM role.
    volumes:
      - ${HOME}/.aws:/home/cloudsentinel/.aws:ro

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      [
        "python",
        "-m",
        "backend.worker",
      ]

volumes:
  postgres_data:
  redis_data:
