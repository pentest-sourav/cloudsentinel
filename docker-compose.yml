services:
  postgres:
    image: postgres:17
    container_name: cloudsentinel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudsentinel}
      POSTGRES_USER: ${POSTGRES_USER:-cloudsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

    ports:
      - "15432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: cloudsentinel-redis
    restart: unless-stopped

    ports:
      - "16379:6379"

    volumes:
      - redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    healthcheck:
      test:
        ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cloudsentinel-api
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cloudsentinel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-cloudsentinel}
      REDIS_URL: redis://redis:6379/0
      SCAN_QUEUE_STREAM: ${SCAN_QUEUE_STREAM:-cloudsentinel:scan_jobs}
      SCAN_QUEUE_GROUP: ${SCAN_QUEUE_GROUP:-cloudsentinel:scan_workers}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      [
        "uvicorn",
        "backend.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cloudsentinel-worker
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cloudsentinel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-cloudsentinel}
      REDIS_URL: redis://redis:6379/0
      SCAN_QUEUE_STREAM: ${SCAN_QUEUE_STREAM:-cloudsentinel:scan_jobs}
      SCAN_QUEUE_GROUP: ${SCAN_QUEUE_GROUP:-cloudsentinel:scan_workers}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      [
        "python",
        "-m",
        "backend.worker",
      ]

volumes:
  postgres_data:
  redis_data:
