services:
  postgres:
    image: postgres:17
    container_name: cloudsentinel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cloudsentinel
      POSTGRES_USER: cloudsentinel
      POSTGRES_PASSWORD: cloudsentinel_dev_password

    ports:
      - "15432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudsentinel -d cloudsentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
