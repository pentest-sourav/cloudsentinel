name: CloudSentinel CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://cloudsentinel:cloudsentinel@localhost:5432/cloudsentinel
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-test-secret
      APP_ENVIRONMENT: test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cloudsentinel
          POSTGRES_USER: cloudsentinel
          POSTGRES_PASSWORD: cloudsentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cloudsentinel -d cloudsentinel"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          pip install pytest

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Compile Python sources
        run: |
          python -m compileall -q             backend             engine             scanner             reporting

      - name: Validate web console JavaScript
        run: node --check frontend/app.js

      - name: Run test suite
        run: pytest -q

      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --strict

  container-security:
    name: Container security
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag cloudsentinel-ci:${{ github.sha }} .

      - name: Validate production compose configuration
        env:
          CLOUDSENTINEL_IMAGE: cloudsentinel-ci:${{ github.sha }}
          CLOUDSENTINEL_DOMAIN: example.com
          POSTGRES_PASSWORD: ci-compose-password
          REDIS_PASSWORD: ci-compose-redis-password
          JWT_SECRET_KEY: ci-compose-production-secret-012345678901234567890123
          CORS_ALLOWED_ORIGINS: https://example.com
        run: docker compose -f deploy/docker-compose.prod.yml config --quiet

      - name: Scan application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudsentinel-ci:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL
