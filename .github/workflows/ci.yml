name: CloudSentinel CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://cloudsentinel:cloudsentinel@localhost:5432/cloudsentinel
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-test-secret
      APP_ENVIRONMENT: test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cloudsentinel
          POSTGRES_USER: cloudsentinel
          POSTGRES_PASSWORD: cloudsentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cloudsentinel -d cloudsentinel"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Compile Python sources
        run: |
          python -m compileall -q             backend             engine             scanner             reporting

      - name: Run test suite
        run: pytest -q

      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --strict
